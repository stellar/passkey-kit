name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.94.0
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Check contract formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Lint contracts and tests
        working-directory: contracts
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --workspace --locked

  contracts-legacy:
    name: legacy contract tests + hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.89.0
          targets: wasm32v1-none
          components: rustfmt

      - name: Check legacy contract formatting
        working-directory: contracts-legacy
        run: cargo fmt --all -- --check

      # `make build` uses `stellar contract build`; the hash depends on the CLI
      # version, so pin the one that produced the published hash.
      - name: Install stellar CLI 27.1.0
        run: |
          set -euo pipefail
          curl -fsSL -o stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli.tar.gz
          sudo install -m 0755 stellar /usr/local/bin/stellar
          stellar --version

      - name: Build and test the legacy-line wallet
        working-directory: contracts-legacy
        run: make test

      # The upgrade-target hash published in SECURITY.md and
      # docs/legacy-wallet-upgrade.md must not drift silently. The CLI build
      # remaps source paths, so this hash is the same on every machine.
      - name: Report the built WASM
        working-directory: contracts-legacy
        run: |
          shasum -a 256 out/smart_wallet.wasm
          stellar contract info meta --wasm out/smart_wallet.wasm || true
          stellar contract info env-meta --wasm out/smart_wallet.wasm || true

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-smart-wallet-wasm
          path: contracts-legacy/out/smart_wallet.wasm

      - name: Assert the WASM hash
        working-directory: contracts-legacy
        run: |
          echo "c079d3a4136eb6ca68eb724acd3d8af11b0be4a0ed82605925a6dfd4dd83a97c  out/smart_wallet.wasm" | shasum -a 256 -c -

  build:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `packageManager` field in package.json, so pin it here.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen: a lockfile that does not match package.json should fail the
      # build rather than be silently resolved away.
      - run: pnpm install --frozen-lockfile

      - name: Verify publish manifest
        run: pnpm run verify:publish-manifest

      # relayer-proxy is NOT a workspace member (the workspace is `packages/**`)
      # but the root vitest run picks up its tests, so its deps must be present.
      - name: Install relayer-proxy dependencies
        working-directory: relayer-proxy
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Audit root dependencies
        run: pnpm audit

      - name: Audit demo dependencies
        working-directory: demo
        run: pnpm audit --ignore-workspace

      - name: Audit relayer-proxy dependencies
        working-directory: relayer-proxy
        run: pnpm audit --ignore-workspace

      # Build BEFORE test: the tests import the generated bindings package by
      # name, which only resolves once its dist/ exists.
      - run: pnpm run build

      - run: pnpm test --run

      - name: Type-check relayer-proxy
        working-directory: relayer-proxy
        run: pnpm typecheck

      # The demo consumes the SDK's public API, so this catches breaking
      # changes that the unit tests do not. It installs separately with
      # `--ignore-workspace`, so it is not covered by the frozen install above.
      - run: pnpm run build:demo

      # `prebuild` regenerates src/version.ts; if that leaves the tree dirty,
      # the committed version constant is stale.
      - name: Check for uncommitted changes
        run: git diff --exit-code

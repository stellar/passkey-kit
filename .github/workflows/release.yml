name: Contract Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Unique release name'
        required: true
        type: string

permissions: {}

jobs:
  release-contract-smart-wallet:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'Release of the smart wallet contract'
      relative_path: 'contracts'
      package: 'smart-wallet'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
